name: Build OpenWrt EDMA/NSS (MX4200 v1 & v2)

on:
  workflow_dispatch:
    inputs:
      mx4200v1_config_url:
        description: Optional HTTPS URL for a temporary MX4200 v1 config
        required: false
        type: string
      mx4200v2_config_url:
        description: Optional HTTPS URL for a temporary MX4200 v2 config
        required: false
        type: string

  schedule:
    - cron: '0 */2 * * *'

concurrency:
  group: openwrt-edma-nss-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENWRT_REPOSITORY: JuliusBairaktaris/openwrt-nss-edma
  OPENWRT_BRANCH: nss-edma-rework

  NSS_REPOSITORY: JuliusBairaktaris/nss-packages
  NSS_BRANCH: edma-nss


jobs:
  check-upstream:
    name: Check for upstream changes
    runs-on: ubuntu-26.04

    outputs:
      openwrt_sha: ${{ steps.upstream.outputs.openwrt_sha }}
      nss_sha: ${{ steps.upstream.outputs.nss_sha }}
      state: ${{ steps.upstream.outputs.state }}
      changed: ${{ steps.compare.outputs.changed }}

    steps:
      - name: Resolve upstream revisions
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          OPENWRT_SHA="$(
            git ls-remote \
              "https://github.com/${OPENWRT_REPOSITORY}.git" \
              "refs/heads/${OPENWRT_BRANCH}" |
            awk '{print $1}'
          )"

          NSS_SHA="$(
            git ls-remote \
              "https://github.com/${NSS_REPOSITORY}.git" \
              "refs/heads/${NSS_BRANCH}" |
            awk '{print $1}'
          )"

          if [ -z "$OPENWRT_SHA" ]; then
            echo "Unable to resolve ${OPENWRT_REPOSITORY}:${OPENWRT_BRANCH}" >&2
            exit 1
          fi

          if [ -z "$NSS_SHA" ]; then
            echo "Unable to resolve ${NSS_REPOSITORY}:${NSS_BRANCH}" >&2
            exit 1
          fi

          STATE="${OPENWRT_SHA}-${NSS_SHA}"

          echo "OpenWrt: ${OPENWRT_SHA}"
          echo "NSS:     ${NSS_SHA}"
          echo "State:   ${STATE}"

          echo "openwrt_sha=${OPENWRT_SHA}" >> "$GITHUB_OUTPUT"
          echo "nss_sha=${NSS_SHA}" >> "$GITHUB_OUTPUT"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

      #
      # IMPORTANT:
      #
      # Restore only. Do NOT use the combined actions/cache@v4 here, otherwise a restored
      # previous marker can be saved under the new key before the firmware has
      # actually built successfully.
      #
      - name: Restore last successful upstream state
        uses: actions/cache/restore@v6
        with:
          path: .last_successful_upstream_state
          key: successful-upstream-${{ steps.upstream.outputs.state }}
          restore-keys: |
            successful-upstream-

      - name: Compare with last successful build
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="${{ steps.upstream.outputs.state }}"

          if [ -f .last_successful_upstream_state ]; then
            PREVIOUS="$(cat .last_successful_upstream_state)"

            echo "Previous successful state: ${PREVIOUS}"
            echo "Current upstream state:    ${CURRENT}"

            if [ "$PREVIOUS" = "$CURRENT" ]; then
              echo "No upstream changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Upstream has changed."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No previous successful state found."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Build OpenWrt ${{ matrix.device }}
    needs: check-upstream

    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.check-upstream.outputs.changed == 'true'

    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        device:
          - mx4200v1
          - mx4200v2

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bzip2 \
            g++ \
            gawk \
            gcc \
            git \
            glibc-source \
            libncurses-dev \
            make \
            rsync

      #
      # Pin OpenWrt to the exact revision observed by check-upstream.
      #
      # This prevents the branch moving between the check and the actual build.
      #
      - name: Checkout OpenWrt EDMA/NSS buildroot
        uses: actions/checkout@v7
        with:
          repository: JuliusBairaktaris/openwrt-nss-edma
          ref: ${{ needs.check-upstream.outputs.openwrt_sha }}
          path: openwrt
          fetch-depth: 0

      - name: Prepare feeds and custom packages
        env:
          NSS_SHA: ${{ needs.check-upstream.outputs.nss_sha }}
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          #
          # Start from the feeds belonging to the exact OpenWrt revision we
          # checked out, then append Julius's NSS feed pinned to the exact
          # revision discovered by check-upstream.
          #
          cp feeds.conf.default feeds.conf

          echo \
            "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git^${NSS_SHA}" \
            >> feeds.conf

          echo
          echo "Feeds:"
          cat feeds.conf
          echo

          #
          # Custom packages used by the SLUDGE builds.
          #
          cd package

          git clone --depth 1 \
            https://github.com/gSpotx2f/luci-app-interfaces-statistics.git

          git clone --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git

          git clone --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git

          git clone --depth 1 \
            https://github.com/gSpotx2f/luci-app-cpu-status.git

          cd ..

          #
          # NSS packages must exist before defconfig resolves the ath11k/NSS
          # dependency tree.
          #
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          if ! ./scripts/feeds list -r nss | grep -q 'qca-nss-drv'; then
            echo "NSS feed did not install correctly." >&2
            exit 1
          fi

      - name: Apply custom files and patches
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          #
          # Root filesystem overlay.
          #
          # This also retains the custom IPQ8074 firmware currently stored
          # under custom/files/lib/firmware/IPQ8074.
          #
          if [ -d ../custom/files ]; then
            mkdir -p files
            cp -a ../custom/files/. files/

            find files/ -type f \
              -exec sh -c \
                'head -n1 "$1" | grep -q "^#!" && chmod +x "$1"' \
                _ {} \;
          fi

          #
          # Optional custom source patches.
          #
          if [ -d ../custom/patches ]; then
            for patch in ../custom/patches/*.patch; do
              [ -f "$patch" ] || continue

              echo "Applying ${patch}"
              patch -p1 < "$patch"
            done
          fi

      - name: Select build configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          MX4200V1_CONFIG_URL: ${{ inputs.mx4200v1_config_url }}
          MX4200V2_CONFIG_URL: ${{ inputs.mx4200v2_config_url }}
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          DEVICE="${{ matrix.device }}"

          case "$DEVICE" in
            mx4200v1)
              CONFIG_URL="$MX4200V1_CONFIG_URL"
              ;;
            mx4200v2)
              CONFIG_URL="$MX4200V2_CONFIG_URL"
              ;;
            *)
              echo "Unsupported device: $DEVICE" >&2
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$CONFIG_URL" ]; then
            echo "Using externally hosted config for ${DEVICE}."

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --proto-redir '=https' \
              --output .config \
              "$CONFIG_URL"

            if [ ! -s .config ]; then
              echo "Downloaded config for ${DEVICE} is empty." >&2
              exit 1
            fi

            sed -i 's/\r$//' .config
          else
            CONFIG_FILE="../config.${DEVICE}.seed"

            if [ ! -f "$CONFIG_FILE" ]; then
              echo "Missing config: ${CONFIG_FILE}" >&2
              exit 1
            fi

            echo "Using repository config for ${DEVICE}."
            cp "$CONFIG_FILE" .config
          fi

          EXPECTED_TARGET="CONFIG_TARGET_qualcommax_ipq807x_DEVICE_linksys_${DEVICE}=y"

          if ! grep -Fxq "$EXPECTED_TARGET" .config; then
            echo "Config does not target ${DEVICE}." >&2
            exit 1
          fi

      - name: Resolve and validate configuration
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt

          make defconfig

          DEVICE="${{ matrix.device }}"

          require_config() {
            local symbol="$1"

            if ! grep -Fxq "$symbol" .config; then
              echo "Required config missing: ${symbol}" >&2
              exit 1
            fi
          }

          reject_config() {
            local symbol="$1"

            if grep -Fxq "$symbol" .config; then
              echo "Unexpected legacy config enabled: ${symbol}" >&2
              exit 1
            fi
          }

          #
          # Common EDMA/NSS + 802.11s requirements.
          #
          require_config "CONFIG_PACKAGE_kmod-qca-nss-drv=y"
          require_config "CONFIG_PACKAGE_kmod-qca-nss-ecm=y"
          require_config "CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=y"

          require_config "CONFIG_ATH11K_NSS_SUPPORT=y"
          require_config "CONFIG_ATH11K_NSS_MESH_SUPPORT=y"

          require_config "CONFIG_PACKAGE_MAC80211_NSS_SUPPORT=y"
          require_config "CONFIG_PACKAGE_MAC80211_MESH=y"

          require_config "CONFIG_NSS_FIRMWARE_VERSION_11_4=y"

          #
          # The two MX4200 revisions have different RAM sizes and therefore
          # require different compile-time ath11k/NSS memory profiles.
          #
          case "$DEVICE" in
            mx4200v1)
              require_config "CONFIG_ATH11K_MEM_PROFILE_512M=y"
              require_config "CONFIG_NSS_MEM_PROFILE_MEDIUM=y"
              ;;
            mx4200v2)
              require_config "CONFIG_ATH11K_MEM_PROFILE_1G=y"
              require_config "CONFIG_NSS_MEM_PROFILE_HIGH=y"
              ;;
          esac

          #
          # These belong to the old Qosmio/QSDK-style data plane and must not
          # reappear in the EDMA/PPE architecture.
          #
          reject_config "CONFIG_PACKAGE_kmod-qca-nss-dp=y"
          reject_config "CONFIG_PACKAGE_kmod-qca-ssdk=y"

          echo
          echo "EDMA/NSS configuration sanity checks passed for ${DEVICE}."
          echo

          grep -E \
            '^(CONFIG_(ATH11K.*(NSS|MEM_PROFILE)|PACKAGE_.*(qca-nss|qca-ppe)|MAC80211_NSS|MAC80211_MESH|NSS_FIRMWARE_VERSION|NSS_MEM_PROFILE))' \
            .config || true

      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if make download -j"$(nproc)" V=s; then
              exit 0
            fi

            echo "Download attempt ${attempt} failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          exit 1

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed; retrying single-threaded for diagnostics"
            make -j1 V=s
          fi

      - name: Upload firmware to Cloudflare R2
        id: upload-firmware
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: openwrt
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt/bin/targets

          TARGET_DIR="$(
            find . \
              -type f \
              -name version.buildinfo \
              -exec dirname {} \; |
            head -n1
          )"

          if [ -z "$TARGET_DIR" ]; then
            echo "Unable to locate build target directory." >&2
            exit 1
          fi

          cd "$TARGET_DIR"

          VERSION="$(tr -d '\n' < version.buildinfo)"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Built ${VERSION} for ${{ matrix.device }}"

          sync
          sha256sum -c sha256sums

          shopt -s nullglob

          for file in openwrt-qualcommax-ipq807x-linksys_${{ matrix.device }}*; do
            if [[ "$file" == *.manifest ]]; then
              newfile="manifest"
            else
              newfile="${file#openwrt-qualcommax-ipq807x-linksys_${{ matrix.device }}-}"
            fi

            mv "$file" "$newfile"
          done

          aws \
            --endpoint-url "$R2_ENDPOINT" \
            s3 cp \
            . \
            "s3://${R2_BUCKET}/${{ matrix.device }}/${VERSION}/" \
            --recursive \
            --exclude "packages/*"

      - name: Emit result JSON
        if: always()
        env:
          R2_URL: ow.okie.eu
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          DEVICE="${{ matrix.device }}"
          STATUS="${{ job.status }}"
          VERSION="${VERSION:-unknown}"

          if [ "$STATUS" = "success" ] && [ "$VERSION" != "unknown" ]; then
            URL="https://${R2_URL}/${DEVICE}/${VERSION}/squashfs-sysupgrade.bin"
          else
            URL="$RUN_URL"
          fi

          jq -n \
            --arg device "$DEVICE" \
            --arg status "$STATUS" \
            --arg version "$VERSION" \
            --arg url "$URL" \
            '{
              device: $device,
              status: $status,
              version: $version,
              url: $url
            }' \
            > "result-${DEVICE}.json"

      - name: Upload result JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.device }}
          path: result-${{ matrix.device }}.json
          if-no-files-found: error


  #
  # The cache marker is written ONLY after the complete v1/v2 matrix succeeds.
  #
  # A manual build using a temporary externally-hosted config deliberately does
  # NOT advance the marker, because that would otherwise suppress the next
  # scheduled build of the repository configs.
  #
  record-success:
    name: Record successful upstream state
    needs:
      - check-upstream
      - build

    if: >
      always() &&
      needs.build.result == 'success' &&
      needs.check-upstream.outputs.changed == 'true' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.mx4200v1_config_url == '' &&
          inputs.mx4200v2_config_url == ''
        )
      )

    runs-on: ubuntu-26.04

    steps:
      - name: Create successful state marker
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ needs.check-upstream.outputs.state }}" \
            > .last_successful_upstream_state

          echo "Recording successful state:"
          cat .last_successful_upstream_state

      - name: Save successful upstream state
        uses: actions/cache/save@v6
        with:
          path: .last_successful_upstream_state
          key: successful-upstream-${{ needs.check-upstream.outputs.state }}


  notify:
    name: Send build result notification to Discord
    needs:
      - check-upstream
      - build
      - record-success

    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.check-upstream.outputs.changed == 'true'
      )

    runs-on: ubuntu-26.04

    steps:
      - name: Download result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Build Discord message
        id: message
        shell: bash
        run: |
          set -euo pipefail

          summary=""
          ok=true

          shopt -s nullglob
          files=(results/result-*.json)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build result artifacts found." >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            device="$(jq -r '.device' "$file")"
            status="$(jq -r '.status' "$file")"
            version="$(jq -r '.version' "$file")"
            url="$(jq -r '.url' "$file")"

            if [ "$status" = "success" ]; then
              summary+=$'\n'
              summary+="🟢 **${device}** built successfully (version: ${version})"
              summary+=$'\n'
              summary+="💾 **sysupgrade image:**"
              summary+=$'\n'
              summary+="<${url}>"
            else
              summary+=$'\n'
              summary+="🔴 **${device}** failed to build → [View Logs](${url})"
              ok=false
            fi
          done

          if $ok; then
            title="# ✅ OpenWrt EDMA/NSS build succeeded!"
          else
            title="# ❌ OpenWrt EDMA/NSS build failed!"
          fi

          content="${title}${summary}"

          {
            echo 'content<<EOF'
            printf '%s\n' "$content"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTENT: ${{ steps.message.outputs.content }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg content "$CONTENT" \
            '{content: $content}' |
          curl \
            --fail \
            --silent \
            --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            "$DISCORD_WEBHOOK_URL"